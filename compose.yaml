services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: markman
      POSTGRES_USER: markman
      POSTGRES_PASSWORD: markman
    ports:
      - "5432:5432"
    volumes:
      - markman-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markman -d markman"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  markman-postgres-data:
